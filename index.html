<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technicals</title>
<meta name="description" content="A swipe feed of investment banking, real estate and hotel technicals.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Technicals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="filter-btn" id="filter-btn" type="button" aria-haspopup="dialog">All tracks</button>
    <span class="spacer"></span>
    <button class="today-btn" id="today-btn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring-bg" cx="12" cy="12" r="9.5"/><circle class="ring-fg" id="today-ring" cx="12" cy="12" r="9.5" pathLength="100" stroke-dasharray="0 100"/></svg>
      <span id="today-n">0</span>
    </button>
    <button class="icon-btn" id="search-btn" type="button" aria-label="Search" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="feed" id="feed" tabindex="-1" aria-label="Card feed">
    <div class="track" id="track"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="explain" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="explain-title" hidden>
  <div class="sheet-head">
    <div class="grip" aria-hidden="true"></div>
    <h2 class="sheet-title" id="explain-title">Explain</h2>
    <button class="text-btn" type="button" data-close>Close</button>
  </div>
  <div class="sheet-body" id="explain-body"></div>
</section>

<section class="sheet sheet-menu" id="menu" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
  <div class="sheet-head">
    <div class="grip" aria-hidden="true"></div>
    <button class="text-btn" type="button" id="menu-back" hidden>Back</button>
    <h2 class="sheet-title" id="menu-title">Menu</h2>
    <button class="text-btn" type="button" data-close>Close</button>
  </div>
  <div class="sheet-body" id="menu-body"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="closing" id="closing" role="dialog" aria-modal="true" aria-labelledby="closing-title" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<noscript><p style="padding:24px">Technicals needs JavaScript turned on.</p></noscript>

<script defer src="deck.js"></script>
<script defer src="data/ib-acct.js"></script>
<script defer src="data/ib-dcf.js"></script>
<script defer src="data/ib-ev.js"></script>
<script defer src="data/ib-lbo.js"></script>
<script defer src="data/ib-ma.js"></script>
<script defer src="data/ib-wacc.js"></script>
<script defer src="data/ib-walk.js"></script>
<script defer src="data/re-basics.js"></script>
<script defer src="data/re-deals.js"></script>
<script defer src="data/re-debt.js"></script>
<script defer src="data/re-dev.js"></script>
<script defer src="data/re-leases.js"></script>
<script defer src="data/re-noi.js"></script>
<script defer src="data/re-returns.js"></script>
<script defer src="data/re-val.js"></script>
<script defer src="data/hotel-agreements.js"></script>
<script defer src="data/hotel-basics.js"></script>
<script defer src="data/hotel-metrics.js"></script>
<script defer src="data/hotel-usali.js"></script>
<script defer src="data/hotel-val.js"></script>
<script defer src="drills/engine.js"></script>
<script defer src="drills/ib.js"></script>
<script defer src="drills/re.js"></script>
<script defer src="drills/hotel.js"></script>
<script defer src="visuals.js"></script>
<script defer src="app.js"></script>
</body>
</html>
